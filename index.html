<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>English Small Talk 訓練追蹤</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1B2330; --muted:#5B6575;
  --line:#E2E6EC; --accent:#0E7490; --accent-ink:#0B5C73; --accent-soft:#E3F1F5;
  --crit:#B9403A; --crit-bg:#F9ECEB; --warn:#A35F0B; --warn-bg:#F8F0E1; --good:#2C7A4B; --good-bg:#E8F3EC;
  --shadow:0 1px 2px rgba(20,28,40,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161F; --surface:#1A202E; --ink:#E7EAF1; --muted:#96A0B2;
    --line:#2A3244; --accent:#54C2DB; --accent-ink:#7FD4E7; --accent-soft:#123441;
    --crit:#E37A73; --crit-bg:#3B2423; --warn:#E0A44F; --warn-bg:#392E1B; --good:#6FC292; --good-bg:#1F3427;
    --shadow:none;
  }
}
:root[data-theme="light"]{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1B2330; --muted:#5B6575;
  --line:#E2E6EC; --accent:#0E7490; --accent-ink:#0B5C73; --accent-soft:#E3F1F5;
  --crit:#B9403A; --crit-bg:#F9ECEB; --warn:#A35F0B; --warn-bg:#F8F0E1; --good:#2C7A4B; --good-bg:#E8F3EC;
  --shadow:0 1px 2px rgba(20,28,40,.05);
}
:root[data-theme="dark"]{
  --bg:#12161F; --surface:#1A202E; --ink:#E7EAF1; --muted:#96A0B2;
  --line:#2A3244; --accent:#54C2DB; --accent-ink:#7FD4E7; --accent-soft:#123441;
  --crit:#E37A73; --crit-bg:#3B2423; --warn:#E0A44F; --warn-bg:#392E1B; --good:#6FC292; --good-bg:#1F3427;
  --shadow:none;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.en{font-family:"Palatino Linotype",Palatino,Georgia,serif; font-size:1.05em}
.wrap{max-width:860px; margin:0 auto; padding:0 16px 80px}
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line); margin-bottom:20px;
}
.top-inner{max-width:860px; margin:0 auto; padding:14px 16px 0}
.top h1{font-size:17px; margin:0 0 2px; letter-spacing:.01em}
.top .sub{font-size:12px; color:var(--muted); margin-bottom:10px}
nav.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  border:none; background:none; color:var(--muted); font:inherit; font-size:13.5px;
  padding:8px 12px 10px; cursor:pointer; white-space:nowrap;
  border-bottom:2px solid transparent;
}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:4px}
.tab.on{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:600}
section.page{display:none}
section.page.on{display:block}
h2{font-size:15px; margin:26px 0 10px; letter-spacing:.02em}
h2 .cnt{color:var(--muted); font-weight:400; font-size:13px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; box-shadow:var(--shadow);
}
.stack{display:flex; flex-direction:column; gap:10px}
/* ---- dashboard ---- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow)}
.stat .n{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2}
.stat .l{font-size:12px; color:var(--muted)}
.stat.crit .n{color:var(--crit)} .stat.warn .n{color:var(--warn)} .stat.good .n{color:var(--good)}
.pill{display:inline-block; font-size:11.5px; padding:1px 9px; border-radius:99px; font-weight:600; letter-spacing:.02em}
.pill.crit{background:var(--crit-bg); color:var(--crit)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.good{background:var(--good-bg); color:var(--good)}
.pill.acc{background:var(--accent-soft); color:var(--accent-ink)}
.target-card{border-left:4px solid var(--accent); }
.target-card .seq{font-size:14px; font-weight:600; margin-top:4px}
.timeline{display:flex; flex-direction:column; gap:0; margin-top:6px}
.tl-row{display:flex; gap:12px; align-items:flex-start; padding:7px 0; border-top:1px dashed var(--line)}
.tl-row:first-child{border-top:none}
.tl-date{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:74px; padding-top:2px}
.tl-body{font-size:13.5px}
.grid-wrap{overflow-x:auto}
table.pgrid{border-collapse:collapse; width:100%; min-width:520px; font-size:13px}
table.pgrid th{font-size:11.5px; color:var(--muted); font-weight:600; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
table.pgrid td{padding:8px; border-bottom:1px solid var(--line); vertical-align:middle}
table.pgrid tr:last-child td{border-bottom:none}
.dot{display:inline-block; width:22px; height:22px; border-radius:6px; text-align:center; line-height:22px; font-size:12px; font-weight:700}
.dot.bad{background:var(--crit-bg); color:var(--crit)}
.dot.ok{background:var(--good-bg); color:var(--good)}
.dot.na{color:var(--muted); opacity:.45}
ol.prio{margin:6px 0 0; padding-left:22px}
ol.prio li{margin-bottom:8px; font-size:14px}
ol.prio .why{color:var(--muted); font-size:12.5px}
/* ---- errors ---- */
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font:inherit; font-size:12.5px; padding:4px 12px; border-radius:99px; cursor:pointer;
}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.err{display:flex; flex-direction:column; gap:6px}
.err .row1{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.err .wrong{color:var(--crit); text-decoration:line-through; text-decoration-thickness:1px; text-decoration-color:color-mix(in srgb,var(--crit) 55%,transparent)}
.err .right{color:var(--good); font-weight:600}
.err .rule{font-size:13px; color:var(--muted)}
.err .meta{font-size:11.5px; color:var(--muted)}
.count-badge{font-variant-numeric:tabular-nums; white-space:nowrap}
/* ---- phrases ---- */
.search{
  width:100%; padding:9px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font:inherit; font-size:14px;
}
.search:focus{outline:2px solid var(--accent); border-color:transparent}
.phrase .p-en{font-weight:600}
.phrase .p-zh{font-size:13px; color:var(--muted)}
.phrase .p-tag{margin-top:4px}
.scen-h{display:flex; align-items:baseline; gap:8px; margin:22px 0 8px}
.scen-h h3{font-size:14px; margin:0}
.scen-h .cnt{font-size:12px; color:var(--muted)}
/* ---- flashcards ---- */
.fc-stage{min-height:230px; display:flex; flex-direction:column; justify-content:center; text-align:center; gap:14px; padding:26px 20px; cursor:pointer}
.fc-label{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.fc-front{font-size:19px; font-weight:600; text-wrap:balance}
.fc-back{font-size:17px; color:var(--good); font-weight:600; text-wrap:balance}
.fc-rule{font-size:13px; color:var(--muted)}
.fc-hint{font-size:12px; color:var(--muted)}
.fc-btns{display:flex; gap:10px; margin-top:12px}
.btn{
  flex:1; padding:11px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font:inherit; font-size:14.5px; font-weight:600; cursor:pointer;
}
.btn:focus-visible{outline:2px solid var(--accent)}
.btn.again{color:var(--crit); border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.btn.got{color:var(--good); border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.btn.plain{flex:none; font-weight:400; font-size:13px; padding:7px 14px; color:var(--muted)}
.fc-meta{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted); margin-top:10px}
/* ---- practice ---- */
.rp .prompt{font-size:13px; color:var(--muted); margin-bottom:2px}
.rp .q{font-weight:600; font-size:16px}
.rp .ans{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line)}
.rp .ans .t{color:var(--good); font-weight:550}
.rp .reveal{margin-top:10px; align-self:flex-start}
.rp.challenge{border-left:4px solid var(--warn)}
.rp ol{margin:8px 0 0; padding-left:20px; font-size:13.5px}
/* ---- prep ---- */
.check{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px dashed var(--line); cursor:pointer}
.check:first-of-type{border-top:none}
.check input{margin-top:4px; accent-color:var(--accent); width:16px; height:16px}
.check .zh{font-size:13px; color:var(--muted)}
.check.done .t{text-decoration:line-through; color:var(--muted)}
footer{margin-top:40px; font-size:11.5px; color:var(--muted); text-align:center}
/* ---- notes ---- */
.note-item{cursor:pointer}
.note-item:hover{border-color:var(--accent)}
.note-item .n-date{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.note-item .n-title{font-weight:600}
.note-md{font-size:14px; line-height:1.75; overflow-wrap:break-word}
.note-md h1{font-size:17px; margin:20px 0 8px; border-bottom:1px solid var(--line); padding-bottom:6px}
.note-md h2{font-size:15.5px; margin:18px 0 6px}
.note-md h3{font-size:14.5px; margin:14px 0 4px; color:var(--accent-ink)}
.note-md h4{font-size:13.5px; margin:12px 0 4px}
.note-md blockquote{margin:8px 0; padding:6px 14px; border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 8px 8px 0; font-family:"Palatino Linotype",Palatino,Georgia,serif}
.note-md ul,.note-md ol{margin:6px 0; padding-left:24px}
.note-md code{background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-family:Consolas,monospace; font-size:.9em}
.note-md pre{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; font-size:12.5px; line-height:1.5}
.note-md pre code{background:none; border:none; padding:0}
.note-md hr{border:none; border-top:1px dashed var(--line); margin:16px 0}
.note-md .tbl-wrap{overflow-x:auto}
.note-md table{border-collapse:collapse; font-size:13px; min-width:300px}
.note-md th,.note-md td{border:1px solid var(--line); padding:5px 10px; text-align:left}
.note-md th{background:var(--bg)}
@media (max-width:520px){
  .stats{grid-template-columns:repeat(2,1fr)}
  body{font-size:14.5px}
}
@media (prefers-reduced-motion: no-preference){
  section.page.on{animation:fade .18s ease}
  @keyframes fade{from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none}}
}
</style>
</head>
<body>

<header class="top"><div class="top-inner">
  <h1>English Small Talk 訓練追蹤</h1>
  <div class="sub" id="subline"></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>

<div class="wrap">
  <section class="page" id="pg-dash"></section>
  <section class="page" id="pg-err"></section>
  <section class="page" id="pg-phr"></section>
  <section class="page" id="pg-fc"></section>
  <section class="page" id="pg-pr"></section>
  <section class="page" id="pg-prep"></section>
  <section class="page" id="pg-notes"></section>
  <footer id="foot"></footer>
</div>

<script type="module">
/* ===== DATA-START（資料已拆到 data.json，更新請改那個檔，不要動這裡） ===== */
let DATA;
try {
  DATA = await fetch('data.json?v=' + Date.now()).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
} catch (e) {
  document.body.innerHTML = '<p style="padding:48px 20px;text-align:center;color:#889">資料載入失敗（' + e.message + '）。<br>請用線上網址開啟 — 本機直接雙擊 HTML 時瀏覽器會封鎖 fetch。</p>';
  throw e;
}
/* ===== DATA-END ===== */

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const store = {
  get k(){ return 'esp_state_v1'; },
  load(){ try{ return JSON.parse(localStorage.getItem(this.k))||{} }catch(e){ return {} } },
  save(o){ localStorage.setItem(this.k, JSON.stringify(o)) }
};
let state = store.load();
state.cards = state.cards || {};   // cardId -> 'got'|'again'
state.checks = state.checks || {}; // checkId -> true

const errCount = e => e.sessions.length;
const errorsSorted = [...DATA.errors].sort((a,b)=> errCount(b)-errCount(a));
const tagList = [...new Set(DATA.errors.map(e=>e.tag))];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- tabs ---------- */
const TABS = [
  ["pg-dash","儀表板"],["pg-err","錯誤庫"],["pg-phr","句型庫"],
  ["pg-fc","複習卡"],["pg-pr","練習"],["pg-prep","上課備忘"],["pg-notes","筆記"]
];
$('#tabs').innerHTML = TABS.map(([id,l],i)=>
  `<button class="tab${i===0?' on':''}" data-pg="${id}">${l}</button>`).join('');
$('#tabs').addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id===b.dataset.pg));
  window.scrollTo({top:0});
});
$('#subline').textContent = `${DATA.sessions.length} 堂課 ・ 最後更新 ${DATA.updated}`;
$('#foot').textContent = `資料來源：${DATA.sourceFiles.length} 份 lesson notes ・ 每日自動掃描更新`;

/* ---------- dashboard ---------- */
(function(){
  const activeN = DATA.patterns.filter(p=>p.status==='active').length;
  const improvingN = DATA.patterns.filter(p=>p.status==='improving').length;
  const repeatErr = errorsSorted.filter(e=>errCount(e)>1).length;
  const statusPill = s => s==='active' ? '<span class="pill crit">還在犯</span>'
    : s==='improving' ? '<span class="pill warn">改善中</span>' : '<span class="pill good">已解決</span>';

  $('#pg-dash').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="n">${DATA.sessions.length}</div><div class="l">已完成場次</div></div>
      <div class="stat crit"><div class="n">${activeN}</div><div class="l">待消除弱點</div></div>
      <div class="stat warn"><div class="n">${improvingN}</div><div class="l">改善中</div></div>
      <div class="stat crit"><div class="n">${repeatErr}</div><div class="l">重複出現的錯誤</div></div>
    </div>

    <h2>目前 Live Target</h2>
    <div class="card target-card">
      <span class="pill acc">本週目標</span>
      <div class="seq en">Answer → one detail → hand it back</div>
      <div style="font-size:13.5px; margin-top:4px">${esc(DATA.prep.target)}</div>
      <div style="font-size:13px; color:var(--muted); margin-top:8px">加碼挑戰：${esc(DATA.challenge.title)} — ${esc(DATA.challenge.rule)}</div>
    </div>

    <h2>本週優先練習</h2>
    <div class="card"><ol class="prio">${DATA.priorities.map(p=>
      `<li><b>${esc(p.t)}</b><br><span class="why">${esc(p.why)}</span></li>`).join('')}</ol></div>

    <h2>痛點 × 場次追蹤</h2>
    <div class="card grid-wrap"><table class="pgrid">
      <thead><tr><th>痛點</th>${DATA.sessions.map(s=>`<th>${s.date}<br>${s.label.replace('面試寒暄','面試')}</th>`).join('')}<th>狀態</th></tr></thead>
      <tbody>${DATA.patterns.map(p=>`<tr>
        <td><b>${esc(p.name)}</b><br><span style="font-size:12px;color:var(--muted)">${esc(p.zh)}</span></td>
        ${DATA.sessions.map(s=>{
          const v = p.history[s.id];
          return `<td>${v==='bad'?'<span class="dot bad">✕</span>': v==='ok'?'<span class="dot ok">✓</span>':'<span class="dot na">–</span>'}</td>`;
        }).join('')}
        <td>${statusPill(p.status)}</td></tr>`).join('')}
      </tbody></table>
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px">✕ 該場出現問題　✓ 該場有進步　– 未觀察到</div>
    </div>

    <h2>Live Target 演進</h2>
    <div class="card"><div class="timeline">${DATA.liveTargets.map(t=>`
      <div class="tl-row"><div class="tl-date">${t.date}</div>
      <div class="tl-body">${t.status==='active'?'<span class="pill acc">進行中</span> ':''}${esc(t.text)}</div></div>`).join('')}
    </div></div>

    <h2>場次紀錄</h2>
    <div class="card"><div class="timeline">${DATA.sessions.map(s=>`
      <div class="tl-row"><div class="tl-date">${s.date}</div>
      <div class="tl-body"><b>${esc(s.label)}</b> ・ <span style="color:var(--muted)">${esc(s.topics)}</span></div></div>`).join('')}
    </div></div>`;
})();

/* ---------- errors ---------- */
(function(){
  let curTag = 'all';
  const render = ()=>{
    const list = errorsSorted.filter(e=> curTag==='all' || e.tag===curTag);
    $('#err-list').innerHTML = list.map(e=>{
      const n = errCount(e);
      return `<div class="card err">
        <div class="row1">
          <span class="en wrong">${esc(e.wrong)}</span>
          <span class="pill ${n>1?'crit':'acc'} count-badge">${n>1?'⚠ ':''}${n} 次</span>
        </div>
        <div class="en right">${esc(e.right)}</div>
        <div class="rule">${esc(e.rule)}</div>
        <div class="meta">${e.tag} ・ 出現於 ${e.sessions.map(id=>{
          const s=DATA.sessions.find(x=>x.id===id); return s? s.date : id;}).join('、')}</div>
      </div>`;
    }).join('');
  };
  $('#pg-err').innerHTML = `
    <h2>錯誤糾正知識庫 <span class="cnt">共 ${DATA.errors.length} 條，重複出現的排最前</span></h2>
    <div class="chips" id="err-chips">
      <button class="chip on" data-t="all">全部</button>
      ${tagList.map(t=>`<button class="chip" data-t="${t}">${t}</button>`).join('')}
    </div>
    <div class="stack" id="err-list"></div>`;
  $('#err-chips').addEventListener('click', e=>{
    const c = e.target.closest('.chip'); if(!c) return;
    curTag = c.dataset.t;
    document.querySelectorAll('#err-chips .chip').forEach(x=>x.classList.toggle('on', x===c));
    render();
  });
  render();
})();

/* ---------- phrases ---------- */
(function(){
  const scenes = [...new Set(DATA.phrases.map(p=>p.sc))];
  let q = '', curSc = 'all';
  const render = ()=>{
    const kw = q.trim().toLowerCase();
    const hit = p => (curSc==='all'||p.sc===curSc) &&
      (!kw || p.en.toLowerCase().includes(kw) || (p.zh||'').toLowerCase().includes(kw) || p.sc.includes(kw));
    const bySc = scenes.map(sc=>({sc, items: DATA.phrases.filter(p=>p.sc===sc && hit(p))})).filter(g=>g.items.length);
    $('#phr-list').innerHTML = bySc.length ? bySc.map(g=>`
      <div class="scen-h"><h3>${g.sc}</h3><span class="cnt">${g.items.length} 句</span></div>
      <div class="stack">${g.items.map(p=>`
        <div class="card phrase">
          <div class="en p-en">${p.star?'★ ':''}${esc(p.en)}</div>
          ${p.zh?`<div class="p-zh">${esc(p.zh)}</div>`:''}
        </div>`).join('')}</div>`).join('')
      : `<div class="card" style="color:var(--muted)">沒有符合「${esc(q)}」的句型</div>`;
  };
  $('#pg-phr').innerHTML = `
    <h2>句型庫 <span class="cnt">共 ${DATA.phrases.length} 句 ・ ★ = 優先記</span></h2>
    <input class="search" id="phr-q" type="search" placeholder="搜尋句型或中文說明…">
    <div class="chips" id="phr-chips">
      <button class="chip on" data-s="all">全部</button>
      ${scenes.map(s=>`<button class="chip" data-s="${s}">${s}</button>`).join('')}
    </div>
    <div id="phr-list"></div>`;
  $('#phr-q').addEventListener('input', e=>{ q = e.target.value; render(); });
  $('#phr-chips').addEventListener('click', e=>{
    const c = e.target.closest('.chip'); if(!c) return;
    curSc = c.dataset.s;
    document.querySelectorAll('#phr-chips .chip').forEach(x=>x.classList.toggle('on', x===c));
    render();
  });
  render();
})();

/* ---------- flashcards ---------- */
(function(){
  // deck: errors (front=wrong, back=right) + starred phrases (front=zh, back=en)
  const cards = [
    ...DATA.errors.map((e,i)=>({id:'e'+i, deck:'糾錯', front:e.wrong, back:e.right, rule:e.rule, weight:errCount(e)})),
    ...DATA.phrases.filter(p=>p.star).map((p,i)=>({id:'p'+i, deck:'句型', front:(p.zh||p.sc)+'，英文怎麼說？', back:p.en, rule:p.sc, weight:1}))
  ];
  let deck = 'all', queue = [], idx = 0, flipped = false;
  const due = () => cards.filter(c=> (deck==='all'||c.deck===deck) && state.cards[c.id]!=='got');
  const build = ()=>{
    queue = due().sort((a,b)=> b.weight-a.weight || (state.cards[a.id]==='again'?-1:0)-(state.cards[b.id]==='again'?-1:0));
    idx = 0; flipped = false;
  };
  const render = ()=>{
    const total = cards.filter(c=>deck==='all'||c.deck===deck).length;
    const got = total - due().length;
    const stage = $('#fc-stage'), btns = $('#fc-btns');
    if(!queue.length || idx>=queue.length){
      build();
      if(!queue.length){
        stage.innerHTML = `<div class="fc-front">🎉 這副牌全部掌握了</div>
          <div class="fc-rule">可以按「重置」再複習一輪</div>`;
        btns.style.display='none';
        $('#fc-meta').innerHTML = `<span>已掌握 ${got}/${total}</span><button class="btn plain" id="fc-reset">重置這副牌</button>`;
        $('#fc-reset').onclick = ()=>{ cards.forEach(c=>{ if(deck==='all'||c.deck===deck) delete state.cards[c.id]; }); store.save(state); build(); render(); };
        return;
      }
    }
    btns.style.display='flex';
    const c = queue[idx];
    stage.innerHTML = flipped
      ? `<div class="fc-label">${c.deck==='糾錯'?'✓ 正確說法':'✓ 句型'}</div>
         <div class="fc-back en">${esc(c.back)}</div>
         <div class="fc-rule">${esc(c.rule)}</div>`
      : `<div class="fc-label">${c.deck==='糾錯'?'✕ 你說過的':'情境'}</div>
         <div class="fc-front en">${esc(c.front)}</div>
         <div class="fc-hint">點卡片看答案</div>`;
    $('#fc-meta').innerHTML = `<span>第 ${idx+1}/${queue.length} 張（待複習）</span><span>已掌握 ${got}/${total}</span>`;
  };
  $('#pg-fc').innerHTML = `
    <h2>複習卡片</h2>
    <div class="chips" id="fc-chips">
      <button class="chip on" data-d="all">全部</button>
      <button class="chip" data-d="糾錯">文法糾錯</button>
      <button class="chip" data-d="句型">重點句型</button>
    </div>
    <div class="card fc-stage" id="fc-stage" role="button" tabindex="0" aria-label="翻卡"></div>
    <div class="fc-btns" id="fc-btns">
      <button class="btn again" id="fc-again">還不熟</button>
      <button class="btn got" id="fc-got">記住了</button>
    </div>
    <div class="fc-meta" id="fc-meta"></div>
    <div style="font-size:12px;color:var(--muted);margin-top:10px">「記住了」的卡會移出待複習；「還不熟」會留在牌堆前面。進度存在這台裝置。</div>`;
  $('#fc-stage').addEventListener('click', ()=>{ flipped=!flipped; render(); });
  $('#fc-stage').addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flipped=!flipped; render(); }});
  $('#fc-again').onclick = ()=>{ state.cards[queue[idx].id]='again'; store.save(state); idx++; flipped=false; render(); };
  $('#fc-got').onclick = ()=>{ state.cards[queue[idx].id]='got'; store.save(state); queue.splice(idx,1); flipped=false; render(); };
  $('#fc-chips').addEventListener('click', e=>{
    const c = e.target.closest('.chip'); if(!c) return;
    deck = c.dataset.d;
    document.querySelectorAll('#fc-chips .chip').forEach(x=>x.classList.toggle('on', x===c));
    build(); render();
  });
  build(); render();
})();

/* ---------- practice ---------- */
(function(){
  $('#pg-pr').innerHTML = `
    <h2>Replay 練習 <span class="cnt">先開口回答，再看目標答案</span></h2>
    <div class="stack">
      ${DATA.replays.map((r,i)=>`
        <div class="card rp" data-i="${i}">
          <div class="prompt">對方問：</div>
          <div class="q en">“${esc(r.q)}”</div>
          <button class="btn plain reveal">看目標答案</button>
          <div class="ans" hidden>
            <div class="t en">“${esc(r.a)}”</div>
            <div style="font-size:12.5px;color:var(--muted);margin-top:6px">${esc(r.note)}</div>
          </div>
        </div>`).join('')}
      <div class="card rp challenge">
        <span class="pill warn">大挑戰</span>
        <div class="q" style="margin-top:6px">${esc(DATA.challenge.title)}</div>
        <div style="font-size:13px;color:var(--muted)">${esc(DATA.challenge.rule)}</div>
        <ol>${DATA.challenge.steps.map(s=>`<li class="en">${esc(s)}</li>`).join('')}</ol>
      </div>
    </div>`;
  $('#pg-pr').addEventListener('click', e=>{
    const b = e.target.closest('.reveal'); if(!b) return;
    const ans = b.parentElement.querySelector('.ans');
    ans.hidden = !ans.hidden;
    b.textContent = ans.hidden ? '看目標答案' : '收起答案';
  });
})();

/* ---------- prep ---------- */
(function(){
  const items = [
    {id:'t0', t:'複習 Live Target：'+DATA.prep.target, zh:''},
    ...DATA.prep.useToday.map((s,i)=>({id:'u'+i, t:'今天刻意使用：'+s})),
    ...DATA.prep.reminders.map((s,i)=>({id:'r'+i, t:s}))
  ];
  $('#pg-prep').innerHTML = `
    <h2>上課前 5 分鐘檢查清單</h2>
    <div class="card" id="prep-list">
      ${items.map(it=>`
        <label class="check ${state.checks[it.id]?'done':''}" data-id="${it.id}">
          <input type="checkbox" ${state.checks[it.id]?'checked':''}>
          <span class="t">${esc(it.t)}</span>
        </label>`).join('')}
    </div>
    <h2>上次沒做到的（這次補上）</h2>
    <div class="card"><div class="timeline">
      ${DATA.prep.lastMissed.map(m=>`<div class="tl-row"><div class="tl-date">↺</div><div class="tl-body">${esc(m)}</div></div>`).join('')}
    </div></div>
    <div style="margin-top:14px"><button class="btn plain" id="prep-reset">清空勾選（下次上課前重來）</button></div>`;
  $('#prep-list').addEventListener('change', e=>{
    const l = e.target.closest('.check'); if(!l) return;
    state.checks[l.dataset.id] = e.target.checked;
    l.classList.toggle('done', e.target.checked);
    store.save(state);
  });
  $('#prep-reset').onclick = ()=>{
    state.checks = {}; store.save(state);
    document.querySelectorAll('#prep-list input').forEach(i=>i.checked=false);
    document.querySelectorAll('#prep-list .check').forEach(c=>c.classList.remove('done'));
  };
})();

/* ---------- notes ---------- */
(function(){
  const pg = $('#pg-notes');
  const inline = (s)=> esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>');
  const mdToHtml = (md)=>{
    md = md.replace(/[-]/g,'').replace(/filecite\w*/gi,'').replace(/turn\d+file\d+/gi,'').replace(/\r/g,'');
    const lines = md.split('\n'); const out = [];
    let para=[], list=null, quote=[], code=null, table=[];
    const flushP=()=>{ if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
    const flushL=()=>{ if(list){ out.push(`<${list.t}>`+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+`</${list.t}>`); list=null; } };
    const flushQ=()=>{ if(quote.length){ out.push('<blockquote>'+inline(quote.join(' '))+'</blockquote>'); quote=[]; } };
    const flushT=()=>{ if(table.length){
      const rows = table.filter(r=>!/^\s*\|[\s\-:|]+\|?\s*$/.test(r));
      out.push('<div class="tbl-wrap"><table>'+rows.map((r,i)=>{
        const cells = r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>inline(c.trim()));
        const tag = i===0?'th':'td';
        return '<tr>'+cells.map(c=>`<${tag}>${c}</${tag}>`).join('')+'</tr>';
      }).join('')+'</table></div>'); table=[]; } };
    const flushAll=()=>{ flushP(); flushL(); flushQ(); flushT(); };
    for(const raw of lines){
      const l = raw;
      if(code!==null){
        if(/^\s*```/.test(l)){ out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>'); code=null; }
        else code.push(l);
        continue;
      }
      if(/^\s*```/.test(l)){ flushAll(); code=[]; continue; }
      const h = l.match(/^(#{1,6})\s+(.*)/);
      if(h){ flushAll(); const d=Math.min(h[1].length,4); out.push(`<h${d}>`+inline(h[2])+`</h${d}>`); continue; }
      if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){ flushAll(); out.push('<hr>'); continue; }
      if(/^\s*\|.*\|/.test(l)){ flushP(); flushL(); flushQ(); table.push(l); continue; }
      const q = l.match(/^\s*>\s?(.*)/);
      if(q){ flushP(); flushL(); flushT(); quote.push(q[1]); continue; }
      const ul = l.match(/^\s*[-*]\s+(.*)/);
      if(ul){ flushP(); flushQ(); flushT(); if(!list||list.t!=='ul'){flushL(); list={t:'ul',items:[]};} list.items.push(ul[1]); continue; }
      const ol = l.match(/^\s*\d+\.\s+(.*)/);
      if(ol){ flushP(); flushQ(); flushT(); if(!list||list.t!=='ol'){flushL(); list={t:'ol',items:[]};} list.items.push(ol[1]); continue; }
      if(!l.trim()){ flushAll(); continue; }
      flushL(); flushQ(); flushT(); para.push(l.trim());
    }
    flushAll();
    return out.join('\n');
  };
  const renderList = ()=>{
    const items = [...DATA.notes].reverse().map(n=>{
      const s = DATA.sessions.find(x=>x.id===n.sid) || {};
      return `<div class="card note-item" data-file="${esc(n.file)}" role="button" tabindex="0">
        <div class="n-date">${s.date||''} ・ ${esc(n.file)}</div>
        <div class="n-title">${esc(s.label||n.file)}</div>
        <div style="font-size:12.5px;color:var(--muted)">${esc(s.topics||'')}</div>
      </div>`;
    }).join('');
    pg.innerHTML = `<h2>Lesson Notes 原文 <span class="cnt">共 ${DATA.notes.length} 份，新的在前</span></h2>
      <div class="stack">${items}</div>`;
  };
  const openNote = async (file)=>{
    pg.innerHTML = `<button class="btn plain" id="note-back">← 回筆記列表</button>
      <div class="card" style="margin-top:10px"><div class="note-md" id="note-body">載入中…</div></div>`;
    $('#note-back').onclick = renderList;
    try{
      const res = await fetch('notes/'+encodeURIComponent(file));
      if(!res.ok) throw new Error(res.status);
      $('#note-body').innerHTML = mdToHtml(await res.text());
      window.scrollTo({top:0});
    }catch(err){
      $('#note-body').innerHTML = `<span style="color:var(--crit)">讀取失敗（${esc(String(err))}）。</span><br>本機直接開檔案時瀏覽器會擋 fetch，請用線上網址開啟；或確認 notes/ 資料夾裡有這個檔案。`;
    }
  };
  pg.addEventListener('click', e=>{
    const c = e.target.closest('.note-item'); if(c) openNote(c.dataset.file);
  });
  pg.addEventListener('keydown', e=>{
    const c = e.target.closest('.note-item');
    if(c && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openNote(c.dataset.file); }
  });
  renderList();
})();

/* default page */
document.getElementById('pg-dash').classList.add('on');
</script>
